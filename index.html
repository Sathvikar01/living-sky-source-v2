<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sathvik A R — Living Sky</title>
<meta name="description" content="Sathvik A R · CS Undergrad · AI/ML · Agents · Full Stack">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4efe6; --ink2:rgba(244,239,230,.74); --ink3:rgba(244,239,230,.5);
  --glass:rgba(14,18,34,.34); --glass2:rgba(14,18,34,.22); --glass-brd:rgba(255,255,255,.16);
  --chip:rgba(255,255,255,.10); --shade:rgba(0,0,0,.35);
  --accent:#ef6a3f; --accent2:#f3bf55; --zen:#1d2f66; --hor:#e0866a; --land:#24341d;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --jelly:cubic-bezier(.34,1.75,.5,1);
  --mx:30%; --my:0%;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:#0b1020;-webkit-text-size-adjust:100%}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}

/* ---------- backdrop ---------- */
#fallback{position:fixed;inset:0;z-index:0;
  background:
   radial-gradient(60vmax 30vmax at 70% 52%, color-mix(in srgb,var(--hor) 70%,transparent), transparent 70%),
   linear-gradient(to bottom,var(--zen) 0%,var(--hor) 56%,var(--land) 57%,#121a10 100%);
  transition:background 2s}
#sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;display:block;opacity:0;transition:opacity 1.2s}
#sky.on{opacity:1}
body.nogl #sky{display:none}
#veil{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 45%);opacity:var(--veil,.6)}

/* ---------- scroller ---------- */
#scroller{position:relative;z-index:3}
#spacer{display:none}

section{position:relative;min-height:100vh;padding:16vh clamp(18px,6vw,96px) 12vh}
.wrap{max-width:1240px;margin:0 auto}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:12px;margin:0 0 18px}
.kicker::before{content:"";width:28px;height:2px;border-radius:2px;background:var(--accent)}
h2.sec{font-family:var(--serif);font-weight:400;font-variation-settings:"opsz" 144,"SOFT" 60;font-size:clamp(40px,6vw,82px);line-height:.98;letter-spacing:-.02em;margin:0 0 28px;text-shadow:0 2px 30px var(--shade)}
h2.sec em{font-style:italic;color:var(--accent2)}

/* ---------- liquid glass ---------- */
/* Base (all browsers): tuned blur + saturation, light-aware specular rim, inner glow, soft shadow.
   Chromium additionally gets a per-element SVG lens (see app.js: displacement map from a rounded-rect SDF). */
.glass{position:relative;isolation:isolate;border-radius:26px;--la:315deg;--lx:-.7;--ly:-.7;--rimk:1;
  /* Keep the dark liquid-glass material fixed over every part of the sky. */
  --ink:#f6f1e7;--ink2:rgba(246,241,231,.8);--ink3:rgba(246,241,231,.6);--shade:rgba(0,0,0,.6);
  --glass:rgba(10,14,28,.44);--glass2:rgba(10,14,28,.26);--chip:rgba(255,255,255,.11);
  --glass-brd:rgba(255,255,255,.17);--accent:#ef6a3f;--accent2:#f3bf55;color:var(--ink);
  background:linear-gradient(160deg,var(--glass2),var(--glass) 62%);
  -webkit-backdrop-filter:blur(14px) saturate(185%) brightness(1.04);backdrop-filter:blur(14px) saturate(185%) brightness(1.04);
  box-shadow:
    inset calc(var(--lx)*-1.4px) calc(var(--ly)*-1.4px) 0 -.4px rgba(255,255,255,calc(.42*var(--rimk))),
    inset calc(var(--lx)*1.2px) calc(var(--ly)*1.2px) 0 -.4px rgba(255,255,255,calc(.14*var(--rimk))),
    inset 1px 0 0 -.3px rgba(255,90,70,.10),inset -1px 0 0 -.3px rgba(80,160,255,.12),
    inset 0 0 0 1px var(--glass-brd),
    inset 0 0 26px rgba(255,255,255,.06),inset 0 -16px 30px -18px rgba(0,0,0,.2),
    0 1px 2px rgba(0,0,0,.10),0 22px 50px -26px rgba(0,0,0,.5);
  transition:background 1.2s,box-shadow .4s}
html.lgsvg .glass.lg-on{background:linear-gradient(160deg,color-mix(in srgb,var(--glass2) 70%,transparent),color-mix(in srgb,var(--glass) 75%,transparent) 62%)}
/* specular rim: brightest where the light comes from (cursor + sun), softer opposite */
.glass>.glass-light{position:absolute!important;inset:0;border-radius:inherit;pointer-events:none;z-index:auto}
.glass-light::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.25px;pointer-events:none;z-index:3;
  background:conic-gradient(from calc(var(--la) - 180deg),
    rgba(255,255,255,calc(.40*var(--rimk))),rgba(255,255,255,.05) 62deg,rgba(255,255,255,.12) 118deg,
    rgba(255,255,255,calc(.98*var(--rimk))) 180deg,rgba(255,255,255,.12) 242deg,rgba(255,255,255,.05) 298deg,rgba(255,255,255,calc(.40*var(--rimk))));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass-light::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:radial-gradient(420px circle at var(--mx) var(--my),rgba(255,255,255,.10),transparent 55%),
             linear-gradient(calc(var(--la) + 180deg),rgba(255,255,255,.09),transparent 38%);mix-blend-mode:screen}
.glass>*{position:relative;z-index:1}
.jelly{transition:background 1.2s,box-shadow .4s;will-change:scale,translate}
.jelly:active{transition-duration:.12s}
html.nospring .jelly:hover{scale:1.03}
html.nospring .jelly:active{scale:.97 .94}

/* raindrops sliding on glass */
.drops{position:absolute!important;inset:0;pointer-events:none;display:none;z-index:2!important;border-radius:inherit;overflow:hidden}
body.raining .drops{display:block}
.drops i{position:absolute;top:-8%;left:var(--x);width:var(--s);height:calc(var(--s)*1.3);
  border-radius:50% 50% 46% 46%/62% 62% 40% 40%;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.85),rgba(255,255,255,.12) 42%,rgba(255,255,255,.04) 62%,rgba(0,0,0,.18) 80%);
  box-shadow:0 1px 1.5px rgba(0,0,0,.25),inset 0 -1px 1px rgba(255,255,255,.4);
  animation:drip var(--d) cubic-bezier(.5,.05,.7,.4) var(--dl) infinite}
.drops i::after{content:"";position:absolute;left:50%;bottom:100%;width:1.5px;height:calc(var(--s)*4);transform:translateX(-50%);
  background:linear-gradient(to top,rgba(255,255,255,.28),transparent);border-radius:2px}
@keyframes drip{0%{top:-8%;opacity:0}6%{opacity:1}30%{top:22%}38%{top:24%}70%{top:70%}100%{top:108%;opacity:.8}}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0d1122;transition:opacity .7s var(--ease),visibility .7s}
#intro.gone{opacity:0;visibility:hidden}
#intro .mix{display:flex;flex-direction:column;align-items:center;gap:18px}
#intro .sw{display:flex;gap:-6px}
#intro .sw i{width:30px;height:30px;border-radius:50% 46% 52% 48%;margin-left:-8px;mix-blend-mode:screen;animation:swirl 1.6s var(--ease) infinite;box-shadow:0 0 18px rgba(255,255,255,.08)}
#intro .sw i:nth-child(1){background:#3a5fb0;animation-delay:0s}
#intro .sw i:nth-child(2){background:#e7814f;animation-delay:.12s}
#intro .sw i:nth-child(3){background:#f2c35e;animation-delay:.24s}
#intro .sw i:nth-child(4){background:#5f8f4a;animation-delay:.36s}
#intro .sw i:nth-child(5){background:#e2452a;animation-delay:.48s}
@keyframes swirl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10px,-6px) scale(.8)}}
#intro p{font-family:var(--serif);font-style:italic;font-size:19px;color:#e9e3d6;margin:0;letter-spacing:.01em}

/* ---------- nav ---------- */
#nav{position:fixed;z-index:30;top:18px;left:18px;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;color:var(--ink)}
#nav a{text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.01em;padding:8px 13px;border-radius:999px;color:var(--ink2);transition:color .3s,background .3s}
#nav a.brand{font-family:var(--serif);font-style:italic;font-weight:500;font-size:16px;color:var(--ink);padding:6px 12px}
#nav a:hover,#nav a.on{color:var(--ink);background:var(--chip)}
#nav .prog{position:absolute!important;left:22px;right:22px;bottom:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;z-index:4!important}
#nav .prog b{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ---------- readout ---------- */
#readout{position:fixed;z-index:31;top:18px;right:18px;max-width:calc(100vw - 36px);pointer-events:none}
#readout>*{pointer-events:auto}
#readout .pill{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;border:0;border-radius:999px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.02em;white-space:nowrap}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);flex:none}
.pill .city{font-family:var(--sans);font-weight:700;font-size:13px}
.pill .sep{width:1px;height:14px;background:var(--ink3)}
.pill .muted{color:var(--ink2)}
.r-panel{position:absolute!important;top:calc(100% + 10px);right:0;max-height:calc(100vh - 100px);overflow:auto;width:min(380px,calc(100vw - 36px));padding:18px;border-radius:24px;transform-origin:100% 0;transition:opacity .35s var(--ease),transform .5s var(--jelly);font-size:13px}
.r-panel[hidden]{display:block!important;opacity:0;transform:scale(.92) translateY(-8px);pointer-events:none!important;visibility:hidden}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.r-grid div{display:flex;flex-direction:column}
.r-grid dt{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.r-grid dd{margin:0;font-weight:600;font-size:15px}
.r-src{font-family:var(--mono);font-size:12px;color:var(--ink3);margin:12px 0 0}
.picker{margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-brd)}
.picker h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:19px;margin:0 0 10px}
.picker .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.picker button,.chipbtn{border:0;cursor:pointer;padding:6px 11px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 1px var(--glass-brd)}
.picker button.on{background:var(--accent);color:#fff;box-shadow:none}
.picker .live{background:transparent;box-shadow:inset 0 0 0 1px var(--ink3)}

/* ---------- hero ---------- */
#hero{display:flex;align-items:flex-end;padding-top:20vh;padding-bottom:10vh}
#hero .wrap{width:100%}
.greet{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink);margin:0 0 16px;text-shadow:0 1px 14px var(--shade)}
.greet b{font-weight:500;color:var(--accent2)}
.name{font-family:var(--serif);font-weight:350;font-variation-settings:"opsz" 144,"SOFT" 100,"WONK" 1;font-size:clamp(64px,13vw,190px);line-height:.86;letter-spacing:-.035em;margin:0 0 26px;text-shadow:0 4px 40px var(--shade)}
.name span{display:inline-block;margin-right:.18em}
.name span:nth-child(2){font-style:italic;color:var(--accent2)}
.hero-card{max-width:620px;padding:26px 28px 24px}
.role{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 12px}
.statement{font-family:var(--serif);font-size:clamp(22px,2.4vw,30px);line-height:1.22;font-weight:400;margin:0 0 14px}
.place{font-family:var(--mono);font-size:12px;color:var(--ink2);margin:0 0 20px;display:flex;gap:8px;align-items:center}
.place::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent2)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;border:0;cursor:pointer}
.btn svg{width:16px;height:16px}
.btn.primary{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,#fff 20%),var(--accent));color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.scrollhint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:8px}
.scrollhint i{width:1.5px;height:34px;background:linear-gradient(var(--ink2),transparent);animation:hint 2.2s var(--ease) infinite;transform-origin:top}
@keyframes hint{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
.panel{padding:30px 32px}
.panel.glass,.feat.glass,.lines.glass,.hero-card.glass,.r-panel.glass,.sheet.glass{background:linear-gradient(160deg,var(--glass2),var(--glass) 55%)}
.lead p{font-size:clamp(17px,1.5vw,19.5px);line-height:1.62;margin:0 0 16px;color:var(--ink)}
.lead p+p{color:var(--ink2)}
.edu .yrs{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent2);display:flex;justify-content:space-between;align-items:center}
.edu .now{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--glass-brd);color:var(--ink)}
.edu h3{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.05;margin:10px 0 4px}
.edu .stage{margin:0 0 4px;font-weight:600}
.edu .loc{margin:0 0 18px;color:var(--ink2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0;padding:0;list-style:none}
.chips li{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--glass-brd)}
.chips.mono li{font-family:var(--mono);font-weight:500;font-size:12px}
.hl{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.hl .glass{padding:20px 20px 18px;border-radius:22px}
.hl b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1;margin-bottom:8px}
.hl span{font-size:13px;color:var(--ink2)}
.closing{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.4vw,32px);line-height:1.25;margin:34px 0 0;max-width:760px;text-shadow:0 2px 24px var(--shade)}

/* ---------- anvaya ---------- */
.feat{padding:34px clamp(22px,3.4vw,46px) 36px}
.feat-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.feat h3{font-family:var(--serif);font-weight:400;font-variation-settings:"opsz" 144;font-size:clamp(34px,4.6vw,64px);line-height:1;letter-spacing:-.02em;margin:14px 0 20px}
.narr{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 36px;margin:0 0 26px}
.narr p{margin:0 0 12px;color:var(--ink2);font-size:16px}
.narr p:first-child{grid-column:1/-1;color:var(--ink);font-family:var(--serif);font-size:clamp(20px,2vw,25px);line-height:1.3}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:8px 0 28px}
.metric{padding:18px 16px 16px;border-radius:20px}
.metric b{display:block;font-family:var(--serif);font-weight:350;font-size:clamp(30px,3.4vw,48px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric b small{font-size:.45em;margin-left:3px;font-family:var(--mono);letter-spacing:0}
.metric span{display:block;margin-top:8px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.feat-foot{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:26px}

/* pipeline creek */
.creek{position:relative;margin:6px 0 0;padding:26px 0 10px}
.creek svg.bed{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.creek .nodes{position:relative;z-index:1;display:grid;grid-template-columns:repeat(6,1fr);gap:16px;list-style:none;margin:0;padding:0}
.creek .nodes li{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.creek .node{width:62px;height:62px;border-radius:50% 46% 54% 48%/48% 54% 46% 52%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.creek .node.lit{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px var(--glass-brd),0 0 0 6px color-mix(in srgb,var(--accent2) 25%,transparent),0 0 30px color-mix(in srgb,var(--accent2) 60%,transparent)}
.creek .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink)}

/* ---------- projects ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{display:flex;flex-direction:column;padding:22px 22px 20px;border-radius:26px;cursor:pointer;min-height:300px;text-align:left;border:0;width:100%}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.emblem{width:62px;height:62px;flex:none;border-radius:18px;display:grid;place-items:center;background:var(--chip);box-shadow:inset 0 0 0 1px var(--glass-brd),inset 0 1px 0 rgba(255,255,255,.3)}
.emblem svg{width:46px;height:46px;overflow:visible}
.card .meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.status{font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:4px 8px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--glass-brd);color:var(--ink)}
.status.live{background:color-mix(in srgb,#5fd38d 30%,transparent)}
.status.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#5fd38d;margin-right:6px;vertical-align:1px;box-shadow:0 0 8px #5fd38d}
.card h3{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.08;margin:0 0 10px;letter-spacing:-.01em}
.card p{margin:0 0 16px;font-size:14.5px;color:var(--ink2);line-height:1.55;flex:1}
.card .links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .links a{font-family:var(--mono);font-size:12px;text-decoration:none;padding:6px 11px;border-radius:999px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--glass-brd)}
.card .links a:hover{background:var(--accent);color:#fff}
.card .more{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)}
.card:focus-visible,.btn:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}

/* expanded sheet */
#sheet-layer{position:fixed;inset:0;z-index:40;pointer-events:none}
#sheet-layer.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(5,8,18,.38);opacity:0;transition:opacity .45s}
#sheet-layer.open .scrim{opacity:1}
.sheet{position:absolute;left:50%;top:50%;width:min(900px,calc(100vw - 28px));max-height:calc(100vh - 40px);overflow:auto;padding:34px clamp(22px,4vw,46px) 32px;border-radius:30px;transform-origin:0 0;
  background:linear-gradient(160deg,var(--glass2),var(--glass) 70%)}
.sheet.glass{background:linear-gradient(160deg,var(--glass2),var(--glass) 70%),var(--glass);-webkit-backdrop-filter:blur(34px) saturate(160%);backdrop-filter:blur(34px) saturate(160%)}
.sheet .x{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1}
.sheet .inner{opacity:0;transition:opacity .35s .18s}
.sheet.shown .inner{opacity:1}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.6vw,56px);line-height:1;margin:16px 0 14px;letter-spacing:-.02em}

.sheet ol li::before{content:counter(pt,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--accent2);padding-top:3px}

.sheet .foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

.stone:nth-child(3){border-radius:40% 60% 48% 52%/58% 46% 54% 42%;margin-top:12px}
.stone:nth-child(4){border-radius:55% 45% 60% 40%/42% 58% 42% 58%;margin-top:56px}

.stone h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:26px;margin:0 0 12px;text-align:center}
.stone .chips{justify-content:center}
.kitstatus{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink2);margin:36px 0 0;text-align:center}

/* ---------- contact ---------- */
#contact{min-height:92vh}
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;align-items:end}

/* ================= astronomy (NOAA sun, SunCalc-style moon) ================= */
const RAD = Math.PI / 180, DEG = 180 / Math.PI;
function solar(ms, lat, lon) {
  const jd = ms / 86400000 + 2440587.5, jc = (jd - 2451545) / 36525;

  const om = 125.04 - 1934.136 * jc;

  const eps0 = 23 + (26 + (21.448 - jc * (46.815 + jc * (0.00059 - jc * 0.001813))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos(om * RAD);

  const y = Math.tan((eps / 2) * RAD) ** 2;
  const eqt = 4 * DEG * (y * Math.sin(2 * L0 * RAD) - 2 * e * Math.sin(M * RAD) + 4 * e * y * Math.sin(M * RAD) * Math.cos(2 * L0 * RAD) - 0.5 * y * y * Math.sin(4 * L0 * RAD) - 1.25 * e * e * Math.sin(2 * M * RAD));
  const d = new Date(ms);

  let tst = (mins + eqt + 4 * lon) % 1440; if (tst < 0) tst += 1440;
  const ha = tst / 4 < 0 ? tst / 4 + 180 : tst / 4 - 180;
  const la = lat * RAD;
  let cz = Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha * RAD);
  cz = clamp(cz, -1, 1);

  if (el > -0.575 && el < 85) { const te = Math.tan(el * RAD); el += (el > 5 ? 58.1 / te - 0.07 / te ** 3 + 0.000086 / te ** 5 : 1735 + el * (-518.2 + el * (103.4 + el * (-12.79 + el * 0.711)))) / 3600; }
  else if (el <= -0.575) el += (-20.774 / Math.tan(el * RAD)) / 3600;
  let az;
  const den = Math.cos(la) * Math.sin(zen);

}

  const l = L + RAD * 6.289 * Math.sin(M), b = RAD * 5.128 * Math.sin(F), dist = 385001 - 20905 * Math.cos(M);
  const ra = Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l));
  const dec = Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l));

  const azS = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));

  const Ms = RAD * (357.5291 + 0.98560028 * d);

function phaseOf(el, rising, solarHour) {

const PHASE_NAME = { night: "Night", blue: "Blue hour", dawn: "Dawn", morning: "Morning", midday: "Midday", afternoon: "Afternoon", golden: "Golden hour", sunset: "Sunset", dusk: "Dusk" };
const PHASE_PRESET = { night: [-26, 110], blue: [-8, 95], dawn: [2, -78], morning: [26, -52], midday: [72, 10], afternoon: [34, 50], golden: [6, 68], sunset: [0.8, 74], dusk: [-2.6, 80] };

const COND_PRESET = {
  clear: { cloud: 0.12, rain: 0, wet: 0, fog: 0.02, storm: 0, snow: 0 },
  cloudy: { cloud: 0.82, rain: 0, wet: 0, fog: 0.08, storm: 0, snow: 0 },
  drizzle: { cloud: 0.8, rain: 0.28, wet: 0.5, fog: 0.18, storm: 0, snow: 0 },
  rain: { cloud: 0.92, rain: 0.72, wet: 0.85, fog: 0.22, storm: 0, snow: 0 },
  storm: { cloud: 1, rain: 1, wet: 1, fog: 0.25, storm: 1, snow: 0 },
  fog: { cloud: 0.45, rain: 0, wet: 0.2, fog: 0.88, storm: 0, snow: 0 },
  snow: { cloud: 0.85, rain: 0, wet: 0, fog: 0.3, storm: 0, snow: 0.85 },

function wmo(code) {
  const c = code | 0;
  if (c === 0) return ["clear", "Clear"];
  if (c === 1) return ["clear", "Mainly clear"];
  if (c === 2) return ["cloudy", "Partly cloudy"];
  if (c === 3) return ["cloudy", "Overcast"];
  if (c === 45 || c === 48) return ["fog", "Fog"];
  if (c >= 51 && c <= 57) return ["drizzle", c >= 56 ? "Freezing drizzle" : "Drizzle"];
  if (c >= 61 && c <= 67) return ["rain", c >= 66 ? "Freezing rain" : c === 61 ? "Light rain" : c === 65 ? "Heavy rain" : "Rain"];
  if (c >= 71 && c <= 77) return ["snow", c === 77 ? "Snow grains" : "Snow"];
  if (c >= 80 && c <= 82) return ["rain", "Showers"];
  if (c === 85 || c === 86) return ["snow", "Snow showers"];
  if (c >= 95) return ["storm", "Thunderstorm"];
  return ["cloudy", "Cloudy"];
}

/* ================= palette ================= */
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const PAL = [ // el, zenith, horizon, sun, ambient(land light)
  [-18, "#03050d", "#0a1122", "#000000", "#141c34"],
  [-12, "#071130", "#17234a", "#1a1430", "#1b2546"],
  [-7, "#142a62", "#4c5891", "#5a3a6a", "#323f6c"],
  [-3, "#273f7f", "#c27a7e", "#ff6a3c", "#5e5577"],
  [0, "#35518f", "#ee8f5f", "#ff7a3a", "#8e6872"],
  [3, "#4568a8", "#ffae68", "#ffa04a", "#c58c6c"],
  [8, "#4f84cc", "#ffd49c", "#ffc77a", "#e2bc93"],
  [18, "#4a8ae0", "#bddbf2", "#fff0d0", "#efe5cf"],
  [45, "#3b7fdc", "#a9d3f3", "#fffaee", "#fbf7ec"],
  [90, "#3478d8", "#a3cff2", "#ffffff", "#ffffff"],
].map((r) => [r[0], hex(r[1]), hex(r[2]), hex(r[3]), hex(r[4])]);
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

/* ================= sky state ================= */
const S = { lat: 12.97, lon: 77.59, city: null, country: null, tz: null, offset: null, src: "default", viewAz: 180, wx: null, wxAt: 0, rise: null, set: null, override: { phase: null, cond: null } };
const KEYS = ["sunX", "sunY", "moonX", "moonY", "sunVis", "sunGlow", "moonVis", "moonPhase", "night", "day", "cloud", "rain", "wet", "fog", "storm", "snow", "wind", "windX"];
const tgt = { zen: [0.2, 0.3, 0.6], hor: [0.9, 0.6, 0.4], sun: [1, 0.8, 0.5], amb: [0.7, 0.6, 0.5], fogc: [0.7, 0.7, 0.75] };
KEYS.forEach((k) => (tgt[k] = 0));
Object.assign(tgt, { cloud: 0.25, wind: 0.2, windX: 1, moonPhase: 0.5 });
const cur = JSON.parse(JSON.stringify(tgt));
cur.flash = 0; cur.time = 0; cur.scroll = 0; cur.mouse = [0.5, 0.3]; cur.rm = RM;
window.SKY = cur;
let liveNow = { phase: "morning", cond: null, condLabel: "—", el: 0 };

function computeTargets(snap) {
  const now = Date.now();

    if (mn.frac < 0.2) mPhase = 0.38;

  let w;
  const condKey = ov.cond || liveNow.cond;
  if (ov.cond) w = { ...COND_PRESET[ov.cond], wind: 0.35, windX: tgt.windX || 1 };
  else if (S.wx) {
    const c = S.wx, [key] = wmo(c.weather_code);
    const code = c.weather_code | 0;

    const toAz = ((c.wind_direction_10m || 0) + 180) % 360;

/* uniforms lerp over ~4s */
function stepSky(dt) {
  const a = 1 - Math.exp(-dt / 1.25);
  for (const k in tgt) {
    const v = tgt[k];
    if (Array.isArray(v)) for (let i = 0; i < 3; i++) cur[k][i] += (v[i] - cur[k][i]) * a;
    else if (k === "sunX" || k === "moonX") { cur[k] += (v - cur[k]) * a; }
    else cur[k] += (v - cur[k]) * a;
  }

/* separable gaussian on the tensor; the vertical pass also solves the eigensystem */

  float E = g.x, G = g.y, F = g.z;

  target(tPaint, W, Hh); gl.useProgram(PP.p); setU(PP, c);
  gl.uniform1f(PP.u.uScale, renderScale); gl.uniform1f(PP.u.uHS, 1.6);
  bindTex(PP, "uTex", 0, tKuwa); bindTex(PP, "uFlow", 1, tFlow); bindTex(PP, "uScene", 2, tScene); bindTex(PP, "uHgt", 3, tHgt); draw();

}

function gpuPoll() {
  if (!TQ || !qPending.length) return;
  const q = qPending[0];
  if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) return;
  qPending.shift();
  const disjoint = gl.getParameter(TQ.GPU_DISJOINT_EXT);
  if (!disjoint) { const ms = gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6; gpuAcc += ms; gpuN++; }
  gl.deleteQuery(q);
}

window.GLRender = (c, dt, now) => {
  if (lost || document.hidden) return;
  if (RM && now - lastDraw < 66) return;
  const fdt = lastDraw ? now - lastDraw : 16; lastDraw = now;
  if (needResize) { needResize = false; resize(); }
  let q = null;
  if (TQ && qPending.length < 3) { q = gl.createQuery(); gl.beginQuery(TQ.TIME_ELAPSED_EXT, q); }
  renderAll(c);
  if (q) { gl.endQuery(TQ.TIME_ELAPSED_EXT); qPending.push(q); }
  gpuPoll();
  probePoll(); probeIssue();
  if (first) { first = false; canvas.classList.add("on"); if (window.__firstFrame) window.__firstFrame(); return; }
  if (typeof window.__glForceLevel === "number") return;
  /* auto quality, gentler than before: needs a sustained slow average (or a run of very slow frames)
     to step down one level, and steps back up when the GPU timer shows clear headroom */
  settle++; if (settle < 8) return;
  if (fdt > 110) { slow++; if (slow >= 6 && level < LEVELS.length - 1) { level++; needResize = true; settle = 0; slow = 0; acc = 0; nfr = 0; gpuAcc = 0; gpuN = 0; } return; }
  slow = Math.max(0, slow - 1);
  if (settle < 20) return;
  acc += fdt; nfr++;
  if (nfr >= 60) {
    const avg = acc / nfr; acc = 0; nfr = 0;
    const g = gpuN >= 20 ? gpuAcc / gpuN : null; gpuAcc = 0; gpuN = 0;
    if (g != null) gpuMs = g;
    const tooSlow = g != null ? g > 15 && avg > 19 : avg > 24;
    const roomy = g != null ? g < 8.5 : avg < 10;
    if (tooSlow && level < LEVELS.length - 1) { level++; needResize = true; settle = 0; }
    else if (roomy && level > 0 && ups < 3 && !RM) { level--; ups++; needResize = true; settle = 0; }
  }
};
/* async pixel probes (PBO + fence, no pipeline stall) used to pick readable ink colours */
let pbo = gl.createBuffer(), pboCap = 0, probeReq = null, probeWait = null;
const probeTarget = makeTarget(128, 1, "rgba8");
window.GLProbe = (pts, cb) => { if (!lost && !first) probeReq = { pts, cb }; };
function probeIssue() {
  if (!probeReq || probeWait) return;
  const { pts, cb } = probeReq; probeReq = null;
  const bytes = pts.length * 4;
  if (!bytes) { cb([]); return; }
  const coords = pts.map(([x, y]) => [
    Math.max(0, Math.min(W - 1, Math.round((x / innerWidth) * W))),
    Math.max(0, Math.min(Hh - 1, Hh - 1 - Math.round((y / innerHeight) * Hh)))
  ]);
  const gather = probeTarget.ok && pts.length <= 128;
  if (gather) {
    target(probeTarget, 128, 1); gl.bindVertexArray(vao); gl.useProgram(PProbe.p);
    bindTex(PProbe, "uTex", 0, tScene);
    const points = new Int32Array(256); coords.forEach((p, i) => points.set(p, i * 2));
    gl.uniform2iv(PProbe.u.uPoints, points); draw();
  } else gl.bindFramebuffer(gl.FRAMEBUFFER, fbo());
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
  if (bytes > pboCap) { pboCap = Math.max(bytes, 256); gl.bufferData(gl.PIXEL_PACK_BUFFER, pboCap, gl.STREAM_READ); }
  if (gather) gl.readPixels(0, 0, pts.length, 1, gl.RGBA, gl.UNSIGNED_BYTE, 0);
  else coords.forEach(([px, py], i) => gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, i * 4));
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  probeWait = { sync: gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0), n: pts.length, cb, age: 0 };
  gl.flush();
}
function probePoll() {
  if (!probeWait) return;
  const st = gl.clientWaitSync(probeWait.sync, 0, 0);
  probeWait.age++;
  if (st === gl.TIMEOUT_EXPIRED && probeWait.age < 30) return;
  gl.deleteSync(probeWait.sync);
  if (st === gl.WAIT_FAILED || st === gl.TIMEOUT_EXPIRED) { probeWait = null; return; }
  const out = new Uint8Array(probeWait.n * 4);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo); gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, out); gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  const L = []; for (let i = 0; i < probeWait.n; i++) L.push((0.2126 * out[i * 4] + 0.7152 * out[i * 4 + 1] + 0.0722 * out[i * 4 + 2]) / 255);
  const cb = probeWait.cb; probeWait = null; try { cb(L); } catch (e) {}
}
window.__glInfo = () => ({ level, scale: +renderScale.toFixed(3), W, H: Hh, display: [Wd, Hd], tensor: [Wt, Ht, fmtT], strokeCache: gridReady, gpuMs: +gpuMs.toFixed(2), timer: !!TQ });
})();
